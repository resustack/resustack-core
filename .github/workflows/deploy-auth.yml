name: Deploy Auth Server (Develop)

on:
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 코드
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./resustack-auth/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/resustack-auth:develop

  deploy:
    name: Deploy to Develop Auth Server
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH 키 설정
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEV_AUTH_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Docker 이미지 Pull 및 컨테이너 재시작
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USERNAME }}@${{ secrets.DEV_AUTH_SERVER_HOST }} << 'EOF'
            cd /app/resustack-auth

            # .env 파일에 이미지 태그 업데이트
            sed -i "s|DOCKER_IMAGE=.*|DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/resustack-auth:develop|" .env

            # 최신 이미지 pull 및 컨테이너 재시작
            docker compose pull auth
            docker compose up -d auth

            # 이전 이미지 정리
            docker image prune -f
          EOF

      - name: 헬스 체크
        run: |
          for i in 1 2 3 4 5 6; do
            echo "헬스 체크 시도 $i/6 (10초 대기)..."
            sleep 10
            if ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USERNAME }}@${{ secrets.DEV_AUTH_SERVER_HOST }} \
              'curl -sf http://localhost:10010/actuator/health' > /dev/null 2>&1; then
              echo "Auth 서버 헬스 체크 통과"
              exit 0
            fi
          done
          echo "헬스 체크 실패"
          exit 1

      - name: 배포 완료
        run: |
          echo "Develop Auth 서버 배포 완료"
          echo "서버: ${{ secrets.DEV_AUTH_SERVER_HOST }}"
          echo "이미지: ${{ secrets.DOCKERHUB_USERNAME }}/resustack-auth:develop"
