name: Deploy API Server (Develop)

on:
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 코드
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./resustack-api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/resustack-api:develop

  deploy:
    name: Deploy to Develop API Server
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH 키 설정
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEV_API_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Docker 이미지 Pull 및 컨테이너 재시작
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USERNAME }}@${{ secrets.DEV_API_SERVER_HOST }} << 'EOF'
            cd /app/resustack-api

            # .env 파일에 이미지 태그 업데이트
            sed -i "s|DOCKER_IMAGE=.*|DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/resustack-api:develop|" .env

            # 최신 이미지 pull 및 컨테이너 재시작
            docker compose pull api
            docker compose up -d api

            # 이전 이미지 정리
            docker image prune -f
          EOF

      - name: 헬스 체크
        run: |
          echo "서버 기동 대기 (15초)..."
          sleep 15
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USERNAME }}@${{ secrets.DEV_API_SERVER_HOST }} \
            'curl -f http://localhost:8080/actuator/health || exit 1'
          echo "API 서버 헬스 체크 통과"

      - name: 배포 완료
        run: |
          echo "Develop API 서버 배포 완료"
          echo "서버: ${{ secrets.DEV_API_SERVER_HOST }}"
          echo "이미지: ${{ secrets.DOCKERHUB_USERNAME }}/resustack-api:develop"
