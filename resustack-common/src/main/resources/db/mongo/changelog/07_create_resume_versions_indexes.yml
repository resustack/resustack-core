databaseChangeLog:
  # --- Resume Versions Collection Indices ---

  # 버전 목록 조회(최신순), 특정 버전 조회, 중복 방지, 최대 버전 번호 조회
  - changeSet:
      id: create-resume-versions-resumeid-version-index
      author: resustack
      changes:
        - createIndex:
            collectionName: resume_versions
            keys: '{ resumeId: 1, version: -1 }'
            options: '{ name: "idx_resumeId_version", unique: true }'
      rollback:
        - dropIndex:
            collectionName: resume_versions
            indexName: idx_resumeId_version

  # 오래된 버전 FIFO 삭제 시 효율적 조회
  - changeSet:
      id: create-resume-versions-resumeid-createdat-index
      author: resustack
      changes:
        - createIndex:
            collectionName: resume_versions
            keys: '{ resumeId: 1, createdAt: 1 }'
            options: '{ name: "idx_resumeId_createdAt" }'
      rollback:
        - dropIndex:
            collectionName: resume_versions
            indexName: idx_resumeId_createdAt
