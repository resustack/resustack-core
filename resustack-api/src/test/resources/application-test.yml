spring:
  config:
    activate:
      on-profile: test

  # Liquibase 비활성화
  liquibase:
    enabled: false

  # MongoDB 테스트 설정
  # Testcontainers를 사용하여 동적으로 URI를 설정하므로 이 설정은 사용되지 않습니다.
  # MongoTestContainerConfig 클래스에서 @DynamicPropertySource를 통해 URI를 주입합니다.
  # mongodb:
  #   uri: mongodb://localhost:27017/test-db

  # Security OAuth2 Mock 설정
  security:
    oauth2:
      client:
        registration:
          naver:
            client-id: "test-client-id"
            client-secret: "test-client-secret"
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: ["name", "email", "profile_image"]
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

jwt:
  secret: "dGVzdC1zZWNyZXQta2V5LW11c3QtYmUtbG9uZy1lbm91Z2gtZm9yLWhzNTEyLWFsZ29yaXRobS10eXBpY2FsbHktNjQtYnl0ZXMtYmFzZTY0LWVuY29kZWQ="
  access-token-validity-in-seconds: 3600
  refresh-token-validity-in-seconds: 86400

logging:
  level:
    root: INFO
