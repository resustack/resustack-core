spring:
  application:
    name: resustack-api

  liquibase:
    enabled: true
    change-log: classpath:db/mongo/db.changelog-master.yml

  security:
    oauth2:
      client:
        registration:
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - name
              - email
              - nickname
              - profile_image
              - gender
              - birth_year
              - phone
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

jwt:
  secret: ${SECRET_KEY}
  access-token-validity-in-seconds: ${ACCESS_TOKEN_TIME}
  refresh-token-validity-in-seconds: ${REFRESH_TOKEN_TIME}

app:
  dev-server-url: ${DEV_SERVER_URL:}
  cookie:
    domain: ${COOKIE_DOMAIN:}
    secure: ${COOKIE_SECURE:false}      # 로컬 개발 환경은 false
    same-site: ${COOKIE_SAME_SITE:Lax}
